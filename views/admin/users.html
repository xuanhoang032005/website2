<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý khách hàng - Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css?v=20260930-3">
</head>
<body class="admin-shell">
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <a href="/admin">
                    <div class="sidebar-logo-icon"><i class="fas fa-store"></i></div>
                    <div>
                        <div class="sidebar-logo-text">AnhTraiStore</div>
                        <div class="sidebar-logo-sub">Admin Panel</div>
                    </div>
                </a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">Tổng quan</div>
                    <a href="/admin" class="nav-item"><i class="fas fa-chart-pie"></i> Dashboard</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">Quản lý</div>
                    <a href="/admin/products" class="nav-item"><i class="fas fa-box"></i> Sản phẩm</a>
                    <a href="/admin/orders" class="nav-item"><i class="fas fa-shopping-bag"></i> Đơn hàng</a>
                    <a href="/admin/users" class="nav-item active"><i class="fas fa-users"></i> Khách hàng</a>
                    <a href="/admin/reviews" class="nav-item"><i class="fas fa-star"></i> Đánh giá</a>
                    <a href="/admin/contacts" class="nav-item"><i class="fas fa-envelope"></i> Liên hệ</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">Marketing</div>
                    <a href="/admin/banners" class="nav-item"><i class="fas fa-images"></i> Banners</a>
                    <a href="/admin/promotions" class="nav-item"><i class="fas fa-bullhorn"></i> Khuyến mãi</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">Hệ thống</div>
                    <a href="/" class="nav-item" target="_blank"><i class="fas fa-external-link-alt"></i> Xem cửa hàng</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user" id="adminUser">
                    <div class="sidebar-avatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">Admin</div>
                        <div class="sidebar-user-role">Quản trị viên</div>
                    </div>
                </div>
                <button class="btn-logout" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="top-header-left">
                    <h1 class="top-header-title">Quản lý khách hàng</h1>
                </div>
                <div class="top-header-right">
                    <span class="header-date" id="currentDate"></span>
                </div>
            </header>

            <div class="page-content">
                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Khách hàng</th>
                                    <th>Email</th>
                                    <th>Điện thoại</th>
                                    <th>Vai trò</th>
                                    <th>Ngày đăng ký</th>
                                </tr>
                            </thead>
                            <tbody id="usersBody">
                                <tr><td colspan="5" style="text-align: center; padding: 48px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--gray-400);"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }
        async function adminLogout() {
            showConfirm('Đăng xuất?', 'Bạn có chắc muốn đăng xuất?', async () => {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const now = new Date();
            document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

            try {
                const userRes = await fetch('/api/auth/me', { credentials: 'include' });
                const userData = await userRes.json();
                if (userData.user) {
                    document.getElementById('adminUser').innerHTML = `<div class="sidebar-avatar">${escapeHtml(userData.user.full_name?.charAt(0) || 'A')}</div><div class="sidebar-user-info"><div class="sidebar-user-name">${escapeHtml(userData.user.full_name || 'Admin')}</div><div class="sidebar-user-role">Quản trị viên</div></div>`;
                }
            } catch (e) {}

            loadNotificationBadges();
            loadUsers();
        });

        async function loadNotificationBadges() {
            try {
                const res = await fetch('/admin/notifications', { credentials: 'include' });
                const data = await res.json();
                const pendingOrders = data.counts?.pending_orders || 0;
                const contacts = data.counts?.contacts || 0;
                const lowStock = data.low_stock_products?.length || 0;
                
                document.getElementById('navBadgeOrders').textContent = pendingOrders > 0 ? pendingOrders : '';
                document.getElementById('navBadgeOrders').style.display = pendingOrders > 0 ? 'inline-flex' : 'none';
                document.getElementById('navBadgeContacts').textContent = contacts > 0 ? contacts : '';
                document.getElementById('navBadgeContacts').style.display = contacts > 0 ? 'inline-flex' : 'none';
                document.getElementById('navBadgeProducts').textContent = lowStock > 0 ? lowStock : '';
                document.getElementById('navBadgeProducts').style.display = lowStock > 0 ? 'inline-flex' : 'none';
            } catch (e) {}
        }

        async function loadUsers() {
            try {
                const res = await fetch('/admin/users/list', { credentials: 'include' });
                const data = await res.json();
                const users = data.users || [];
                const tbody = document.getElementById('usersBody');

                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-users"></i><h3>Chưa có khách hàng nào</h3></div></td></tr>`;
                    return;
                }

                let html = '';
                users.forEach(u => {
                    const isAdmin = u.role === 'admin';
                    html += `<tr>
                        <td>
                            <div class="user-info">
                                <div class="user-avatar">${escapeHtml(u.full_name?.charAt(0) || 'U')}</div>
                                <div>
                                    <div class="user-name">${escapeHtml(u.full_name || 'N/A')}</div>
                                </div>
                            </div>
                        </td>
                        <td>${escapeHtml(u.email || '-')}</td>
                        <td>${escapeHtml(u.phone || '-')}</td>
                        <td><span class="badge ${isAdmin ? 'badge-primary' : 'badge-success'}">${isAdmin ? 'Admin' : 'Khách hàng'}</span></td>
                        <td>${u.created_at ? new Date(u.created_at).toLocaleDateString('vi-VN') : '-'}</td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            } catch (e) {
                document.getElementById('usersBody').innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải dữ liệu</h3></div></td></tr>`;
            }
        }
    </script>
    <script src="/js/admin-ui.js?v=20260914-4"></script>
</body>
</html>
